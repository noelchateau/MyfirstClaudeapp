[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pianoscribe"
version = "0.1.0"
description = "Transcribe solo piano audio into sheet music (MusicXML, MIDI, PDF)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "librosa>=0.10",
    "soundfile",
    "music21>=9",
    "pretty_midi",
]

[project.optional-dependencies]
# Much higher accuracy on real recordings; downloads a ~165 MB model on first use.
neural = ["torch", "piano_transcription_inference"]
dev = ["pytest"]

[project.scripts]
pianoscribe = "pianoscribe.cli:main"

[tool.setuptools]
packages = ["pianoscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
